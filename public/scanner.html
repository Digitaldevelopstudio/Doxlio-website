<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doxlio Scanner</title>
<style>
:root{--ac:#6366f1;--ac2:#06b6d4;--bg:#0b0d1a;--pn:#161a30;--bd:#2a2f52;--tx:#eef0ff;--mut:#a3a9cc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.scr{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}.scr.on{display:flex}
.tb{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--pn);border-bottom:1px solid var(--bd)}
.tb h1{font-size:17px;margin:0;flex:1}
.ct{flex:1;position:relative;overflow:auto;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0}
.bb{display:flex;justify-content:space-around;gap:4px;padding:8px 8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--pn);border-top:1px solid var(--bd)}
button{font:inherit;color:var(--tx);background:#252a4d;border:1px solid var(--bd);border-radius:10px;padding:9px 12px;cursor:pointer}
button:disabled{opacity:.5}button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;font-weight:700}
.ab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;min-width:64px;font-size:12px;color:var(--mut)}.ab i{font-style:normal;font-size:22px;color:var(--tx)}.ab.p{color:#fff}.ab.p i{background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:12px;padding:2px 14px}
video{width:100%;height:100%;object-fit:cover;background:#000}
#sCam .ct{padding:0;background:#000}.guide{position:absolute;inset:9% 7%;border:2px dashed #fff8;border-radius:10px;pointer-events:none}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:13px;color:#fffd;text-shadow:0 1px 3px #000}
.shut{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:linear-gradient(135deg,var(--ac),var(--ac2));padding:0}
.stg{position:relative;line-height:0;touch-action:none}.stg canvas{border-radius:6px}#ov{position:absolute;left:0;top:0;touch-action:none}
#loupe{position:absolute;width:110px;height:110px;border-radius:50%;border:3px solid #fff;background:#000;display:none;z-index:3;pointer-events:none}
.strip{display:flex;gap:8px;overflow-x:auto;padding:8px 10px;background:var(--pn);border-top:1px solid var(--bd)}
.strip button{white-space:nowrap}.strip button.on{outline:2px solid var(--ac2);background:#2f3566}
.sl{display:grid;grid-template-columns:84px 1fr 38px;gap:8px;align-items:center;font-size:13px;padding:2px 12px;background:var(--pn)}input[type=range]{width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%;align-self:flex-start}
.tile{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:6px;text-align:center}.tile img{width:100%;border-radius:6px;background:#fff}
.tile .r{display:flex;justify-content:space-between;margin-top:4px}.tile button{padding:4px 7px;font-size:13px}
.col{width:100%;max-width:560px;align-self:flex-start;display:flex;flex-direction:column;gap:10px}
input[type=text],select,textarea{width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:#0f1226;color:var(--tx);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
#busy{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:30;overflow:hidden}
#busy i{position:absolute;left:0;right:0;height:5px;background:var(--ac2);box-shadow:0 0 24px 8px var(--ac2);animation:sw 1.1s ease-in-out infinite alternate}
@keyframes sw{from{top:8%}to{top:88%}}#busy b{z-index:2;font-size:18px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#000d;color:#fff;border-radius:10px;padding:8px 14px;z-index:40;display:none;max-width:90%;text-align:center}
#toast.err{background:#b42318}
#pv{position:fixed;inset:0;background:#000c;display:none;overflow:auto;padding:16px;z-index:35}#pv img{display:block;max-width:min(700px,100%);margin:0 auto 12px;background:#fff}
.big{padding:16px;font-size:16px}.lg{font-size:44px}.chip{font-size:12px;color:var(--mut)}
</style></head><body>

<div class="scr on" id="sStart"><div class="tb"><h1>📄 Doxlio Scanner</h1><span class="chip" id="cvst"></span></div>
<div class="ct"><div class="col" style="align-self:center;text-align:center"><div class="lg">📷</div><p style="color:var(--mut)">Scan documents with your camera or import photos. Everything stays on your device.</p>
<button class="p big" id="bOpenCam">Open camera</button><button class="big" id="bOpenGal">Import from gallery</button></div></div></div>

<div class="scr" id="sCam"><div class="tb"><button id="cBack" aria-label="Close camera">✕</button><h1>Scan</h1><button id="cTorch" hidden aria-label="Flash">⚡ Flash</button><button id="cFlip" aria-label="Switch camera">🔄</button></div>
<div class="ct"><video id="vid" playsinline muted autoplay></video><div class="guide"></div><div class="hint">Place the document inside the frame</div></div>
<div class="bb" style="align-items:center"><button class="ab" id="cGal"><i>🖼</i>Gallery</button><button class="shut" id="cShot" aria-label="Capture"></button><button class="ab" id="cDone"><i>✔</i><span id="cCnt">Done</span></button></div></div>

<div class="scr" id="sCrop"><div class="tb"><h1>Crop</h1><span class="chip">Drag any of the 8 handles</span></div>
<div class="ct" id="cropCt"><div class="stg" id="stg"><canvas id="cc"></canvas><canvas id="ov"></canvas><div id="loupe"><canvas id="lc" width="110" height="110" style="width:100%;height:100%;border-radius:50%"></canvas></div></div></div>
<div class="bb"><button class="ab" id="kAuto"><i>✨</i>Auto Detect</button><button class="ab" id="kRot"><i>⟳</i>Rotate</button><button class="ab" id="kRetake"><i>↩</i>Retake</button><button class="ab p" id="kNext"><i>➜</i>Next</button></div></div>

<div class="scr" id="sEnh"><div class="tb"><button id="eBack" aria-label="Back to crop">←</button><h1>Enhance</h1><button id="eCmp">Hold: original</button></div>
<div class="ct" id="enhCt"><canvas id="ec" style="border-radius:6px;background:#fff"></canvas></div>
<div class="strip" id="flt"></div>
<label class="sl">Brightness<input type="range" id="rb" min="-100" max="100" value="0"><span id="vb">0</span></label>
<label class="sl">Contrast<input type="range" id="rc" min="-50" max="100" value="0"><span id="vc">0</span></label>
<label class="sl">Sharpness<input type="range" id="rs" min="0" max="100" value="0"><span id="vs">0</span></label>
<div class="bb"><button class="ab" id="eRotL"><i>⟲</i>Left</button><button class="ab" id="eRotR"><i>⟳</i>Right</button><button class="ab" id="eReset"><i>↺</i>Reset</button><button class="ab p" id="eDone"><i>✔</i>Done</button></div></div>

<div class="scr" id="sRev"><div class="tb"><h1 id="rTitle">Pages</h1></div><div class="ct"><div class="grid" id="grid"></div></div>
<div class="bb"><button class="ab" id="rCam"><i>📷</i>Add page</button><button class="ab" id="rGal"><i>🖼</i>Gallery</button><button class="ab" id="rPrev"><i>👁</i>Preview</button><button class="ab p" id="rExp"><i>⬇</i>Export</button></div></div>

<div class="scr" id="sExp"><div class="tb"><button id="xBack" aria-label="Back">←</button><h1>Export</h1></div>
<div class="ct"><div class="col">
<label>File name<input type="text" id="xName" value="Doxlio-scan"></label>
<div class="row"><label>Page size<select id="xSize"><option value="a4">A4</option><option value="letter">US Letter</option><option value="fit">Same as scan</option></select></label><label>Quality<select id="xQ"><option value=".92">High</option><option value=".8">Medium</option><option value=".6">Small file</option></select></label></div>
<div class="row"><button class="p" id="xPdf">Download PDF</button><button id="xPrint">Print PDF</button></div>
<div class="row"><button id="xJpg">Save all pages as JPG</button><button id="xPv">Preview</button></div>
<hr style="border-color:var(--bd);width:100%">
<div class="row"><label>OCR language<select id="xLang"><option value="eng">English</option><option value="urd">Urdu</option><option value="ara">Arabic</option><option value="hin">Hindi</option><option value="fra">French</option><option value="spa">Spanish</option><option value="deu">German</option></select></label><button id="xOcr" style="align-self:end">Extract text (OCR)</button></div>
<textarea id="xOut" rows="9" placeholder="Extracted text appears here. You can edit it."></textarea>
<div class="row"><button id="xCopy">Copy text</button><button id="xTxt">Download TXT</button></div>
<div class="row"><button id="xAdd">+ Add more pages</button><button id="xNew">Start new scan</button></div>
</div></div></div>

<div id="busy"><i></i><b id="busyT">Scanning…</b></div><div id="toast" role="status"></div>
<div id="pv"><div style="text-align:center;margin-bottom:12px"><button class="p" id="pvx">Close</button></div><div id="pvi"></div></div>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function cnv(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c}
var pages=[],draft=null,editIdx=-1,queue=[],stream=null,facing='environment',torchOn=false,cvReady=false,cvMode='';
var work={src:null,corners:[],sc:1,reCrop:false};
function toast(t,err){var e=$('toast');e.textContent=t;e.className=err?'err':'';e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},err?5000:2200)}
function busy(on,t){$('busy').style.display=on?'flex':'none';if(t)$('busyT').textContent=t}
function show(id){stopCamIf(id);[].forEach.call(document.querySelectorAll('.scr'),function(s){s.classList.toggle('on',s.id===id)});cur=id}
var cur='sStart';

/* ---- OpenCV (optional) ---- */
function loadCV(){if(window.__cvl)return;window.__cvl=1;$('cvst').textContent='Edge detection: loading OpenCV…';
 var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.9.0-release.3/dist/opencv.js';
 function ok(){cvReady=true;cvMode='OpenCV';$('cvst').textContent='Edge detection: OpenCV'}function bad(){cvMode='basic';$('cvst').textContent='Edge detection: basic (OpenCV unavailable)'}
 s.onload=function(){try{if(typeof cv==='undefined')return bad();if(cv.then)cv.then(function(m){window.cv=m;ok()}).catch(bad);else if(cv.Mat)ok();else cv.onRuntimeInitialized=ok}catch(e){bad()}};s.onerror=bad;document.head.appendChild(s)}

/* ---- Camera ---- */
function stopCam(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}$('vid').srcObject=null;torchOn=false}
function stopCamIf(next){if(next!=='sCam')stopCam()}
function openCam(){
 loadCV();
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Camera is not available here (needs HTTPS). Use Gallery instead.',1);return}
 stopCam();
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false}).then(function(s){
  stream=s;$('vid').srcObject=s;show('sCam');$('cCnt').textContent=pages.length?'Done ('+pages.length+')':'Done';$('cDone').style.visibility=pages.length?'visible':'hidden';
  var tr=s.getVideoTracks()[0],cp=tr.getCapabilities?tr.getCapabilities():{};$('cTorch').hidden=!cp.torch;$('cTorch').textContent='⚡ Flash';
 }).catch(function(e){var n=e&&e.name;toast(n==='NotAllowedError'?'Camera permission denied. Allow camera access in your browser settings, or use Gallery.':n==='NotFoundError'?'No camera found on this device.':'Could not open the camera: '+(e&&e.message||n),1);if(cur==='sCam')show(pages.length?'sRev':'sStart')})}
$('bOpenCam').onclick=openCam;$('rCam').onclick=openCam;$('xAdd').onclick=openCam;
$('cBack').onclick=function(){stopCam();show(pages.length?'sRev':'sStart')};
$('cDone').onclick=function(){stopCam();drawReview();show('sRev')};
$('cFlip').onclick=function(){facing=facing==='environment'?'user':'environment';openCam()};
$('cTorch').onclick=function(){var tr=stream&&stream.getVideoTracks()[0];if(!tr)return;torchOn=!torchOn;tr.applyConstraints({advanced:[{torch:torchOn}]}).then(function(){$('cTorch').textContent=torchOn?'⚡ Flash on':'⚡ Flash'}).catch(function(){torchOn=false;toast('Flash is not supported on this camera.',1)})};
$('cShot').onclick=function(){var v=$('vid');if(!v.videoWidth){toast('Camera is not ready yet.',1);return}
 var c=cnv(v.videoWidth,v.videoHeight);c.getContext('2d').drawImage(v,0,0);stopCam();begin(c)};
document.addEventListener('visibilitychange',function(){if(document.hidden&&stream){stopCam();show(pages.length?'sRev':'sStart')}});
window.addEventListener('pagehide',stopCam);

/* ---- Gallery ---- */
function gal(){$('file').click()}$('bOpenGal').onclick=gal;$('rGal').onclick=gal;$('cGal').onclick=function(){stopCam();gal()};
$('file').onchange=async function(e){var fs=[].slice.call(e.target.files);e.target.value='';if(!fs.length)return;loadCV();
 var imgs=[];for(var i=0;i<fs.length;i++){var f=fs[i];if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast(f.name+': unsupported type (use JPG, PNG, WebP).',1);continue}if(f.size>25*1048576){toast(f.name+': larger than 25 MB.',1);continue}
  try{var b=window.createImageBitmap?await createImageBitmap(f,{imageOrientation:'from-image'}):await new Promise(function(r,j){var im=new Image();im.onload=function(){r(im)};im.onerror=j;im.src=URL.createObjectURL(f)});var c=cnv(b.width,b.height);c.getContext('2d').drawImage(b,0,0);imgs.push(c)}catch(x){toast('Could not read '+f.name,1)}}
 if(imgs.length){queue=imgs;begin(queue.shift())}};

/* ---- Crop ---- */
var MAXIN=3000;
function fit(c){var m=Math.max(c.width,c.height),k=m>MAXIN?MAXIN/m:1;if(k===1)return c;var o=cnv(Math.round(c.width*k),Math.round(c.height*k));o.getContext('2d').drawImage(c,0,0,o.width,o.height);return o}
function begin(c){work.src=fit(c);work.reCrop=false;editIdx=-1;show('sCrop');layout();work.corners=defCorners();busy(true,'Detecting document…');
 setTimeout(function(){var r=detect(work.src);work.corners=r.c||defCorners();busy(false);drawOv();toast(r.c?'Document detected ('+r.how+'). Adjust the handles if needed.':'No clear edges found. Drag the handles to the corners.',!r.c)},400)}
function startCrop(src,corners){work.src=src;work.corners=corners;work.reCrop=true;show('sCrop');layout();drawOv()}
function defCorners(){var w=work.src.width,h=work.src.height,x=w*.05,y=h*.05;return[[x,y],[w-x,y],[w-x,h-y],[x,h-y]]}
function layout(){var ct=$('cropCt'),aw=ct.clientWidth-20,ah=ct.clientHeight-20,s=work.src;work.sc=Math.min(aw/s.width,ah/s.height);
 var w=Math.max(40,Math.round(s.width*work.sc)),h=Math.max(40,Math.round(s.height*work.sc));
 [$('cc'),$('ov')].forEach(function(c){c.width=w;c.height=h});$('cc').getContext('2d').drawImage(s,0,0,w,h)}
window.addEventListener('resize',function(){if(cur==='sCrop'&&work.src){layout();drawOv()}if(cur==='sEnh')drawEnh()});
function handles(){var p=work.corners,m=[];for(var i=0;i<4;i++){var a=p[i],b=p[(i+1)%4];m.push([(a[0]+b[0])/2,(a[1]+b[1])/2])}return p.concat(m)}
function drawOv(){var c=$('ov'),x=c.getContext('2d'),s=work.sc,p=work.corners.map(function(a){return[a[0]*s,a[1]*s]});x.clearRect(0,0,c.width,c.height);
 x.fillStyle='rgba(0,0,0,.5)';x.beginPath();x.rect(0,0,c.width,c.height);x.moveTo(p[0][0],p[0][1]);for(var i=3;i>=0;i--)x.lineTo(p[i][0],p[i][1]);x.fill('evenodd');
 x.strokeStyle='#06b6d4';x.lineWidth=2;x.beginPath();p.forEach(function(a,i){i?x.lineTo(a[0],a[1]):x.moveTo(a[0],a[1])});x.closePath();x.stroke();
 handles().forEach(function(h,i){var X=h[0]*s,Y=h[1]*s;x.fillStyle='#fff';x.strokeStyle='#6366f1';x.lineWidth=3;x.beginPath();x.arc(X,Y,i<4?12:9,0,7);x.fill();x.stroke();if(i>=4){x.fillStyle='#6366f1';x.beginPath();x.arc(X,Y,3,0,7);x.fill()}})}
var drag=-1,last=null;
function pt(e){var r=$('ov').getBoundingClientRect();return[(e.clientX-r.left)/work.sc,(e.clientY-r.top)/work.sc]}
function clamp(v,m){return Math.max(0,Math.min(m,v))}
function loupe(on,e){var l=$('loupe');if(!on){l.style.display='none';return}var q=pt(e),s=work.src,lc=$('lc').getContext('2d'),z=3,r=55/z;
 lc.fillStyle='#000';lc.fillRect(0,0,110,110);lc.drawImage(s,q[0]-r,q[1]-r,r*2,r*2,0,0,110,110);lc.strokeStyle='#06b6d4';lc.beginPath();lc.moveTo(55,40);lc.lineTo(55,70);lc.moveTo(40,55);lc.lineTo(70,55);lc.stroke();
 var b=$('ov').getBoundingClientRect(),sb=$('stg').getBoundingClientRect(),px=e.clientX-sb.left,py=e.clientY-sb.top;l.style.left=(px<150&&py<150?b.width-120:10)+'px';l.style.top='10px';l.style.display='block'}
$('ov').addEventListener('pointerdown',function(e){var q=pt(e),H=handles(),bd=1e9;drag=-1;H.forEach(function(h,i){var d=Math.hypot(h[0]-q[0],h[1]-q[1])*work.sc;if(d<bd){bd=d;drag=i}});
 if(bd>34){drag=-1;return}$('ov').setPointerCapture(e.pointerId);e.preventDefault();last=q;loupe(true,e)});
$('ov').addEventListener('pointermove',function(e){if(drag<0)return;var q=pt(e),W=work.src.width,Hh=work.src.height,p=work.corners;
 if(drag<4){p[drag]=[clamp(q[0],W),clamp(q[1],Hh)]}
 else{var i=drag-4,a=p[i],b=p[(i+1)%4],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,pr=(q[0]-last[0])*nx+(q[1]-last[1])*ny;
  [i,(i+1)%4].forEach(function(k){p[k]=[clamp(p[k][0]+nx*pr,W),clamp(p[k][1]+ny*pr,Hh)]})}
 last=q;drawOv();loupe(true,e)});
['pointerup','pointercancel'].forEach(function(n){$('ov').addEventListener(n,function(){drag=-1;loupe(false)})});
$('kAuto').onclick=function(){busy(true,'Detecting document…');setTimeout(function(){var r=detect(work.src);busy(false);if(r.c){work.corners=r.c;drawOv();toast('Document detected ('+r.how+').')}else toast('No clear document edges found. Adjust manually.',1)},300)};
$('kRot').onclick=function(){var s=work.src,o=cnv(s.height,s.width),x=o.getContext('2d');x.translate(o.width,0);x.rotate(Math.PI/2);x.drawImage(s,0,0);var h=s.height;work.corners=work.corners.map(function(a){return[h-a[1],a[0]]});work.src=o;layout();drawOv()};
$('kRetake').onclick=function(){queue=[];if(work.reCrop){show('sEnh');return}if(pages.length||draft)show('sRev');else show('sStart');if(!work.reCrop)openCam()};

/* ---- Detection ---- */
function order(p){var s=p.map(function(a){return a[0]+a[1]}),d=p.map(function(a){return a[0]-a[1]});return[p[s.indexOf(Math.min.apply(0,s))],p[d.indexOf(Math.max.apply(0,d))],p[s.indexOf(Math.max.apply(0,s))],p[d.indexOf(Math.min.apply(0,d))]]}
function detect(src){var r=null;if(cvReady)r=cvDetect(src);if(r)return{c:r,how:'OpenCV'};r=jsDetect(src);return r?{c:r,how:'basic'}:{c:null}}
function cvDetect(src){var ms=[];function M(m){ms.push(m);return m}
 try{var k=Math.min(1,700/Math.max(src.width,src.height)),sm=cnv(Math.round(src.width*k),Math.round(src.height*k));sm.getContext('2d').drawImage(src,0,0,sm.width,sm.height);
  var im=M(cv.imread(sm)),g=M(new cv.Mat()),e=M(new cv.Mat());cv.cvtColor(im,g,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(g,g,new cv.Size(5,5),0);cv.Canny(g,e,50,150);
  cv.dilate(e,e,M(cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(5,5))));var cs=M(new cv.MatVector()),hi=M(new cv.Mat());cv.findContours(e,cs,hi,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);
  var best=null,ba=sm.width*sm.height*.15,full=sm.width*sm.height*.97;
  for(var i=0;i<cs.size();i++){var c=cs.get(i),ap=new cv.Mat();cv.approxPolyDP(c,ap,.02*cv.arcLength(c,true),true);
   if(ap.rows===4&&cv.isContourConvex(ap)){var a=cv.contourArea(ap);if(a>ba&&a<full){ba=a;best=[];for(var j=0;j<4;j++)best.push([ap.data32S[j*2]/k,ap.data32S[j*2+1]/k])}}ap.delete();c.delete()}
  return best?order(best):null}catch(x){return null}finally{ms.forEach(function(m){try{m.delete()}catch(_){}})}}
function jsDetect(src){
 var k=Math.min(1,260/Math.max(src.width,src.height)),w=Math.max(8,Math.round(src.width*k)),h=Math.max(8,Math.round(src.height*k)),c=cnv(w,h);c.getContext('2d',{willReadFrequently:true}).drawImage(src,0,0,w,h);
 var d=c.getContext('2d').getImageData(0,0,w,h).data,N=w*h,g=new Uint8Array(N),hist=new Array(256).fill(0),i;
 for(i=0;i<N;i++){g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];hist[g[i]]++}

$('kNext').onclick=function(){busy(true,'Scanning…');setTimeout(function(){try{var base=warp(work.src,work.corners);
  var old=editIdx>=0?pages[editIdx]:null;draft={orig:work.src,corners:work.corners.map(function(a){return a.slice()}),base:base,f:old?old.f:'auto',b:old?old.b:0,c:old?old.c:0,s:old?old.s:0,rot:0};
  setTimeout(function(){busy(false);openEnh()},650)}catch(e){busy(false);toast('Scanning failed: '+e.message,1)}},350)};

function blurBg(c){var k=Math.max(1,Math.round(Math.max(c.width,c.height)/24)),s=cnv(Math.max(1,c.width/k|0),Math.max(1,c.height/k|0));s.getContext('2d').drawImage(c,0,0,s.width,s.height);var b=cnv(c.width,c.height),x=b.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(s,0,0,c.width,c.height);return x.getImageData(0,0,c.width,c.height).data}

/* ---- Enhance screen ---- */
$('flt').innerHTML=FL.map(function(f){return'<button data-f="'+f[0]+'">'+f[1]+'</button>'}).join('');
$('flt').onclick=function(e){var f=e.target.getAttribute('data-f');if(!f||!draft)return;draft.f=f;syncEnh();drawEnh()};

[['rb','b','vb'],['rc','c','vc'],['rs','s','vs']].forEach(function(a){$(a[0]).oninput=function(){draft[a[1]]=+this.value;$(a[2]).textContent=this.value;drawEnh()}});

$('eDone').onclick=function(){if(editIdx>=0){pages[editIdx]=draft}else pages.push(draft);draft=null;editIdx=-1;
 if(queue.length){begin(queue.shift())}else{drawReview();show('sRev');toast('Page saved.')}};

/* ---- Review ---- */
function drawReview(){$('rTitle').textContent=pages.length+' page'+(pages.length===1?'':'s');var g=$('grid');g.innerHTML='';
 pages.forEach(function(p,i){var t=document.createElement('div');t.className='tile';t.innerHTML='<img alt="Page '+(i+1)+'" src="'+render(p,320).toDataURL('image/jpeg',.7)+'"><div>Page '+(i+1)+'</div><div class="r"><button data-a="L" data-i="'+i+'" aria-label="Move earlier">◀</button><button data-a="R" data-i="'+i+'" aria-label="Move later">▶</button><button data-a="T" data-i="'+i+'" aria-label="Rotate">⟳</button></div><div class="r"><button data-a="E" data-i="'+i+'">Enhance</button><button data-a="C" data-i="'+i+'">Crop</button><button data-a="D" data-i="'+i+'" aria-label="Delete">🗑</button></div>';g.appendChild(t)})}

$('rPrev').onclick=preview;$('xPv').onclick=preview;

$('rExp').onclick=function(){show('sExp')};$('xBack').onclick=function(){drawReview();show('sRev')};
